{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-body">
        <h4 class="card-title mb-3">Eliminar registro</h4>
        <p>¿Confirmás que querés eliminar <strong>{{ object }}</strong> ({{ object.empresa }})?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'activos:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
