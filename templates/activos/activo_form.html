{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-body">
        <h4 class="card-title mb-3">
            {% if object %}Editar registro{% else %}Nuevo registro{% endif %}
        </h4>
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="row g-3">
                {% for field in form %}
                <div class="col-md-6">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{% url 'activos:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
